name: Check

on:
  pull_request:
    branches:
      - main
  # Also on main so the CI badge reflects the state of the default branch.
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a main run — the CI badge reads its conclusion.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    name: Format, package exports and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check

  peer-typescript:
    name: Check configs with typescript@${{ matrix.typescript }}
    runs-on: ubuntu-latest
    strategy:
      # Report every entry: one failure must not cancel the others.
      fail-fast: false
      matrix:
        # 'latest' picks up a newly released major the open peer range already admits.
        typescript: ['7', 'latest']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm add --save-dev typescript@${{ matrix.typescript }}
      # pnpm's release-age gate can resolve a tag to an older release; log the real one.
      - run: pnpm exec tsc --version
      - run: pnpm run check:ts
